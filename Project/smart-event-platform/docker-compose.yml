version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_events_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - event_net

  mongodb:
    image: mongo:6.0
    container_name: smart_events_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - event_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - event_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - event_net

  fastapi_backend:
    build: 
      context: ./backend-fastapi
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - kafka
    environment:
      - POSTGRES_SERVER=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - event_net
    volumes:
      - ./backend-fastapi:/app

  notification_service:
    build:
      context: ./services/notification-service
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smart_events_notifications
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - event_net

  ticket_inventory:
    build:
      context: ./services/ticket-inventory-service
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smart_events_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - event_net

networks:
  event_net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data: